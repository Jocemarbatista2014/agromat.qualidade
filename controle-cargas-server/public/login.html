<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle de Cargas - Entrar</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#16201a;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
h1{font-size:24px;margin:0}p{margin:0;color:#55655b}
input{font:inherit;padding:12px;border:1px solid #d6ddd8;border-radius:8px;width:100%}
button{font:inherit;font-weight:600;padding:12px;border:0;border-radius:8px;background:#1d6a42;color:#fff;cursor:pointer}
button[disabled]{opacity:.6}.err{color:#a13232;min-height:1.2em;font-size:14px}
</style></head><body>
<form id="f"><h1>Controle de Cargas</h1><p>Digite o código de acesso.</p>
<input id="c" type="password" autocomplete="current-password" autofocus aria-label="Código de acesso">
<div class="err" id="e" role="alert"></div><button id="b" type="submit">Entrar</button></form>
<script>
document.getElementById("f").addEventListener("submit",async function(ev){
  ev.preventDefault();var b=document.getElementById("b"),e=document.getElementById("e");b.disabled=true;e.textContent="";
  try{var r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({code:document.getElementById("c").value})});
    var j=await r.json().catch(function(){return{}});
    if(r.ok){location.reload();return}e.textContent=j.error||"Não foi possível entrar."}
  catch(x){e.textContent="Sem conexão. Tente de novo."}b.disabled=false});
</script></body></html>
