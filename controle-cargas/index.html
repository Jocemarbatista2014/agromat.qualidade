<title>Controle de Cargas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabeçalho com ações + abas (Cargas | Contratos). Cargas: indicadores, filtros, lista. Contratos: lista com saldo. */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --fg: #16201a;
  --muted: #55655b;
  --line: #d6ddd8;
  --accent: #1d6a42;
  --accent-fg: #ffffff;
  --accent-soft: #dcefe4;
  --danger: #a13232;
  --warn-bg: #fbecc6;
  --warn-fg: #6e4708;
  --st-agendada-fg: #3b4d64; --st-agendada-bg: #e2e8f0;
  --st-carregando-fg: #86570a; --st-carregando-bg: #fbecc6;
  --st-transito-fg: #13578e; --st-transito-bg: #d8eaf9;
  --st-descarregando-fg: #693c99; --st-descarregando-bg: #ecdff8;
  --st-entregue-fg: #1d6a42; --st-entregue-bg: #dcefe4;
  --st-cancelada-fg: #8c2f2f; --st-cancelada-bg: #f6dcdc;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.logo { display: block; height: 46px; width: auto; max-width: 100%; margin-bottom: 10px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 12px; cursor: pointer; font-weight: 500; min-height: 38px; display: inline-flex; align-items: center; justify-content: center; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn.danger { color: var(--danger); }
.btn[disabled] { opacity: .55; cursor: default; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px; cursor: pointer; font-weight: 600; color: var(--muted); margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.tile .lbl { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tile .val { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.15; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .note { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

.toolbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
.toolbar .q { grid-column: 1 / -1; }
.toolbar .clear .btn { width: 100%; }
.sumbar { display: flex; gap: 8px 20px; flex-wrap: wrap; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.sumbar .big { font-family: var(--font-display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.sumbar .parts { display: flex; gap: 4px 18px; flex-wrap: wrap; align-items: baseline; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; flex: 1 1 240px; }
.sumbar .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.rcontrol { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; justify-content: space-between; }
.rcontrol .field { min-width: 200px; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
table.rt { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.rt th, .rt td { padding: 10px 14px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.rt th:first-child, .rt td:first-child { text-align: left; white-space: normal; min-width: 170px; overflow-wrap: anywhere; }
.rt th { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.rt tfoot td { font-weight: 700; border-bottom: 0; }
.rt .share { display: inline-block; width: 64px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; vertical-align: middle; margin-right: 8px; }
.rt .share > span { display: block; height: 100%; background: var(--accent); }
.rt .neg { color: var(--danger); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-height: 38px; width: 100%; min-width: 0;
}
.field textarea { resize: vertical; min-height: 70px; }
.field.missing input { border-color: var(--st-carregando-fg); background: var(--warn-bg); }
.field.missing label { color: var(--warn-fg); }
.upper { text-transform: uppercase; font-family: var(--font-mono); letter-spacing: .06em; }

.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; }

.list { display: flex; flex-direction: column; gap: 8px; }
.row {
  display: grid; grid-template-columns: 128px minmax(0, 1fr) 118px auto; gap: 8px 16px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
}
.row .c-status { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.st-agendada { color: var(--st-agendada-fg); background: var(--st-agendada-bg); }
.st-carregando { color: var(--st-carregando-fg); background: var(--st-carregando-bg); }
.st-transito { color: var(--st-transito-fg); background: var(--st-transito-bg); }
.st-descarregando { color: var(--st-descarregando-fg); background: var(--st-descarregando-bg); }
.st-entregue { color: var(--st-entregue-fg); background: var(--st-entregue-bg); }
.st-cancelada { color: var(--st-cancelada-fg); background: var(--st-cancelada-bg); }
.date { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.route { display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; font-weight: 600; overflow-wrap: anywhere; }
.route .arrow { color: var(--muted); font-weight: 400; }
.meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 2px; overflow-wrap: anywhere; }
.plate { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--fg); }
.tag { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; border: 1px dashed var(--muted); border-radius: 4px; padding: 0 5px; }
.chip { font-size: 12px; font-weight: 600; border-radius: 4px; padding: 0 6px; background: var(--accent-soft); color: var(--accent); }
.chip.none { background: var(--warn-bg); color: var(--warn-fg); }
.c-load { font-variant-numeric: tabular-nums; text-align: right; }
.c-load .t { font-family: var(--font-mono); font-weight: 500; }
.c-load .f { color: var(--muted); font-size: 13px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }

.crow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 10px 16px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.crow .num { font-weight: 600; overflow-wrap: anywhere; }
.crow > * { min-width: 0; }
.crow .actions { justify-content: flex-start; }
.crow .actions .btn.primary { flex: 1 1 100%; }
.crow .nums { flex-direction: column; gap: 2px; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 6px 0 4px; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.bar.over > span { background: var(--danger); }
.nums { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 28px 20px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.empty h2 { font-family: var(--font-display); font-size: 20px; margin: 0; }
.empty p { margin: 0; color: var(--muted); max-width: 60ch; }
.empty .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }

.overlay { position: fixed; inset: 0; background: rgba(8, 14, 10, .55); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); z-index: 20; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; width: 100%; max-width: 580px; padding: 18px; margin-block: auto; display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { font-family: var(--font-display); font-size: 20px; margin: 0; }
.sheet p { margin: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.span2 { grid-column: 1 / -1; }
.sheet .foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.err { color: var(--danger); font-size: 13px; min-height: 1em; }
.muted { color: var(--muted); font-size: 13px; }

.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 28px 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.thumb { max-height: 150px; max-width: 100%; border: 1px solid var(--line); border-radius: 6px; object-fit: contain; align-self: flex-start; }
.reading { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.warnbox { background: var(--warn-bg); color: var(--warn-fg); border-radius: 6px; padding: 8px 12px; font-size: 14px; }
.warnbox ul { margin: 4px 0 0; padding-left: 18px; }
.warnbox.red, .err.alert { background: var(--st-cancelada-bg); color: var(--st-cancelada-fg); border: 1px solid var(--danger); font-weight: 600; }
.err.alert { border-radius: 6px; padding: 8px 12px; font-size: 14px; }
details.more summary { cursor: pointer; color: var(--muted); font-size: 14px; margin-bottom: 10px; }
.pick { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.pick .info { min-width: 0; flex: 1 1 220px; overflow-wrap: anywhere; }
.pick .warn { color: var(--danger); font-size: 13px; }
.chk { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg);
  border-radius: 6px; padding: 8px 14px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }

@media (max-width: 860px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "status load" "route route" "actions actions"; }
  .c-status { grid-area: status; flex-direction: row; align-items: center; gap: 8px; }
  .c-route { grid-area: route; }
  .c-load { grid-area: load; }
  .actions { grid-area: actions; justify-content: flex-start; }
  .crow { grid-template-columns: minmax(0, 1fr); }
  .crow .actions { justify-content: flex-start; }
}
@media (max-width: 520px) {
  h1 { font-size: 24px; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .tile .val { font-size: 26px; }
  .top-actions { width: 100%; }
  .top-actions .btn { flex: 1 1 auto; }
}
</style>

  async function makeLiberacaoPdf(c, L) {
    var doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
    var M = 18, R = 192, MAXW = R - M, y = 24;
    var logo = null;
    try { logo = await logoPng(); } catch (e) {}
    if (logo) doc.addImage(logo.url, "PNG", R - 52, 14, 52, 52 / logo.ratio);
    doc.setFont("helvetica", "normal"); doc.setFontSize(24); doc.setTextColor(20, 20, 20);
    doc.text("LOTE LIBERADO", M, 28);
    y = 48;
    function room(hh) { if (y + hh > 280) { doc.addPage(); y = 22; } }
    function kv(label, value, color, normal) {
      doc.setFont("helvetica", normal ? "normal" : "bold"); doc.setFontSize(12); doc.setTextColor(20, 20, 20);
      var lab = label, lw = doc.getTextWidth(lab) + 2.5;
      var lines = doc.splitTextToSize(String(value || ""), MAXW - lw);
      if (!lines.length) lines = [""];
      room(lines.length * 6 + 4);
      doc.text(lab, M, y);
      if (color) doc.setTextColor(color[0], color[1], color[2]);
      lines.forEach(function (t, i) { doc.text(t, i ? M : M + lw, y + i * 6); });
      y += lines.length * 6 + 3;
    }
    function link(url) {
      if (!url) return;
      room(9);
      doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(0, 102, 204);
      doc.textWithLink(url, M, y, { url: url });
      var w = doc.getTextWidth(url);
      doc.setDrawColor(0, 102, 204); doc.setLineWidth(0.3); doc.line(M, y + 1, M + w, y + 1);
      y += 8;
    }
    function sep() { room(10); doc.setDrawColor(160, 160, 160); doc.setLineWidth(0.3); doc.line(M, y, R - 20, y); y += 9; }
    var RED = [230, 40, 40];
    kv("LOCAL DE CARREGAMENTO:", L.localCarga);
    kv("VENDEDOR:", L.vendedor);
    link(L.mapaCarga);
    kv("COMPRADOR:", L.comprador);
    sep();
    kv("LOCAL DE DESCARGA:", L.localDescarga);
    if (L.mapaDescarga) { kv("LOCALIZAÇÃO:", ""); y -= 3; link(L.mapaDescarga); }
    if (Number(L.frete) > 0) kv("Frete empresa:", fmtBRL(L.frete), null, true);
    sep();
    kv("PRODUTO:", L.produto);
    kv("Peso e Qualidade:", L.pesoQualidade);
    kv("VOLUME TOTAL LIBERADO:", fmtT(L.volume).replace(" t", " ton"), RED);
    if (L.contratoConfirmacao) kv("CONTRATO DE CONFIRMAÇÃO:", "Nº " + L.contratoConfirmacao);
    if (L.restricoes) { y += 2; kv("RESTRIÇÕES DE CAMINHÕES :", L.restricoes, RED); }
    if (L.obsFiscal) {
      y += 4; room(16);
      doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(20, 20, 20);
      var ol = doc.splitTextToSize(L.obsFiscal, MAXW);
      doc.text(ol, M, y); y += ol.length * 6 + 3;
    }
    if (L.aviso) {
      y += 4; room(24);
      doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(RED[0], RED[1], RED[2]);
      doc.text("AVISO", M, y); y += 7;
      doc.setFontSize(10); doc.setTextColor(20, 20, 20);
      var al = doc.splitTextToSize(L.aviso, MAXW);
      doc.text(al, M, y); y += al.length * 5 + 4;
    }
    var emails = String(L.emailsOrdens || "").split(/[\s,;]+/).filter(Boolean);
    if (emails.length) {
      y += 3; room(14 + emails.length * 7);
      doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(20, 20, 20);
      doc.text("ENVIAR ORDENS CARREGAMENTO PARA EMAIL:", M, y); y += 8;
      doc.setFontSize(11); doc.setTextColor(0, 128, 128);
      emails.forEach(function (em) { doc.text("•  " + em, M + 3, y); y += 7; });
    }
    if (L.emailFrete) {
      y += 6; room(12);

      h("h2", { id: "os-title" }, "Acionar classificador"),
      h("p", { class: "muted" }, "Contrato " + c.numero + (c.parte ? " · " + c.parte : "") + ". Confira os dados, copie o texto e envie ao classificador."),
      grid, pre,
      h("div", { class: "foot" },
        h("button", { class: "btn", type: "button", onclick: closeSheet }, "Fechar"), wa,
        h("button", { class: "btn primary", type: "button", onclick: async function () {
          var t = pre.value;
          try { await navigator.clipboard.writeText(t); toast("Texto copiado."); }
          catch (e) { pre.focus(); pre.select(); toast("Selecione e copie o texto."); }
        } }, "Copiar texto")));
    box.addEventListener("input", atualiza); box.addEventListener("change", atualiza);
    openSheet(box);
    $("os-un").addEventListener("change", function () {
      var x = OS_UNIDADES[$("os-un").value];
      $("os-contr").value = x.contratante; $("os-cnpj").value = x.cnpj; $("os-cdest").value = x.cidade; $("os-ldest").value = x.local;
      atualiza();
    });
    atualiza();
  }

  /* ---------- escolher contrato ---------- */
  function openPicker(o) {
    var showAll = !o.produto;
    var box = h("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-labelledby": "pk-title" });
    function draw() {
      var list = contratos.filter(function (c) { return c.status !== "encerrado" && (showAll || c.produto === o.produto); })
        .sort(function (a, b) { return String(a.numero).localeCompare(String(b.numero), "pt-BR", { numeric: true }); });
      var cards = list.map(function (c) {
        var s = saldo(c), excede = o.tons > 0 && o.tons > s;
        return h("div", { class: "pick" },
          h("div", { class: "info" },
            h("div", { class: "num" }, "Contrato " + c.numero + (c.parte ? " · " + c.parte : "")),
            h("div", { class: "meta" }, h("span", {}, c.produto || ""), h("span", {}, "Saldo " + fmtT(s) + " de " + fmtT(c.toneladas))),
            excede ? h("div", { class: "warn" }, s > 0 ? "Esta carga passa do saldo em " + fmtT(o.tons - s) + "." : "Contrato sem saldo.") : null),
          h("button", { class: "btn primary small", type: "button", onclick: function () { o.onPick(c); } }, "Vincular"));
      });
      box.replaceChildren();
      put(box,
        h("h2", { id: "pk-title" }, "Escolher contrato"),
        o.resumo ? h("p", { class: "muted" }, o.resumo) : null,
        o.produto ? h("label", { class: "chk" }, h("input", { type: "checkbox", checked: showAll, onchange: function (e) { showAll = e.target.checked; draw(); } }), "Mostrar contratos de outros produtos") : null,
        cards.length ? cards : h("div", { class: "empty" }, h("p", {}, "Nenhum contrato aberto" + (showAll ? "" : " de " + o.produto) + "."),
          h("div", { class: "btns" }, h("button", { class: "btn", type: "button", onclick: function () { openContratoForm(null, function () { openPicker(o); }); } }, "Cadastrar contrato"))),
        h("div", { class: "foot" },
          h("button", { class: "btn", type: "button", onclick: o.onBack || closeSheet }, o.onBack ? "Voltar" : "Cancelar"),
          o.onSkip ? h("button", { class: "btn", type: "button", onclick: o.onSkip }, "Salvar sem contrato") : null));
    }
    draw();
    openSheet(box);
  }

  function vincularCarga(it) {
    openPicker({ produto: it.produto, tons: Number(it.toneladas) || 0, resumo: (it.placa ? "Placa " + it.placa + " · " : "") + fmtT(it.toneladas),
      onPick: async function (c) {
        var ok = await patch(col, it.id, { contratoId: c.id, atualizadoEm: new Date().toISOString() });
        if (ok) { closeSheet(); toast("Carga vinculada ao contrato " + c.numero + "."); }
      } });
  }

  /* ---------- placa já enviada ---------- */
  function achaPlaca(p, excl) {
    p = normPlaca(p);
    if (!p) return [];
    return items.filter(function (i) { return !i.exemplo && i.id !== excl && normPlaca(i.placa) === p; })
      .sort(function (a, b) { return String(b.data || "").localeCompare(String(a.data || "")); });
  }
  function descCarga(i) {
    var c = i.contratoId ? contratoById(i.contratoId) : null;
    return (c ? "contrato " + c.numero + (c.parte ? " (" + c.parte + ")" : "") : "sem contrato") + " · " + fmtT(i.toneladas) + " · " +
      fmtDateFull(i.data) + " · " + ((STATUS[i.status] || {}).label || "");
  }
  function placaAtiva(lista) { return lista.some(function (i) { return OPEN.indexOf(i.status) >= 0 || i.data === ymd(); }); }

  /* ---------- ordem de carregamento ---------- */
  var st = null;
  function normPlaca(s) { return String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 7); }
  function placaOk(p) { return /^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(p); }
  function normalize(d) {
    d = d && typeof d === "object" ? d : {};
    var kg = Number(d.pesoKg), peso = "";
    if (kg > 0) peso = kg < 200 ? String(kg) : String(Math.round(kg) / 1000);
    var avisos = Array.isArray(d.avisos) ? d.avisos.filter(function (a) { return typeof a === "string" && a.trim(); }).slice(0, 6) : [];
    var o = {
      placa: normPlaca(d.placa), peso: peso, pesoTipo: typeof d.pesoTipo === "string" ? d.pesoTipo : "",
      transp: typeof d.transportadora === "string" ? d.transportadora.trim() : "",
      motorista: typeof d.motorista === "string" ? d.motorista.trim() : "",
      produto: ["Soja", "Milho", "Farelo", "Óleo"].indexOf(d.produto) >= 0 ? d.produto : "",
      origem: typeof d.origem === "string" ? d.origem.trim() : "", destino: typeof d.destino === "string" ? d.destino.trim() : "",
      numeroOrdem: d.numeroOrdem != null ? String(d.numeroOrdem).trim() : "", avisos: avisos
    };
    o.miss = { placa: !o.placa, peso: !o.peso, transp: !o.transp };
    if (o.placa && !placaOk(o.placa)) o.avisos.push("Confira a placa: ela não segue o formato ABC1D23.");
    return o;
  }
  function loadPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if (pdfReady) return pdfReady;
    pdfReady = new Promise(function (res, rej) {
      var s = document.createElement("script"); s.src = PDFJS;
      s.onload = function () { if (window.pdfjsLib) { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; res(window.pdfjsLib); } else rej(new Error("pdf")); };
      s.onerror = function () { pdfReady = null; rej(new Error("pdf")); };
      document.head.append(s);
    });
    return pdfReady;
  }
  async function toImages(file) {
    var types = imgLimits.mediaTypes || [];
    if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) {
      var lib = await loadPdfJs();
      var pdf = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
      var out = [], n = Math.min(pdf.numPages, 2, imgLimits.maxCount || 2);
      for (var i = 1; i <= n; i++) {
        var page = await pdf.getPage(i), vp = page.getViewport({ scale: 1.6 });
        var cv = document.createElement("canvas"); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
        await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
        out.push(await new Promise(function (r) { cv.toBlob(r, "image/png"); }));
      }
      return out;
    }
    if (types.length && types.indexOf(file.type) < 0) { var e = new Error("tipo"); e.code = "image_rejected"; throw e; }
    return [file];
  }
  function ordemError(e) {
    var c = e && e.code;
    if (c === "not_granted") return "Você não permitiu que o app use o Claude para ler documentos.";
    if (c === "rate_limited") return "Muitas leituras seguidas. Espere um pouco e tente de novo.";
    if (c === "image_rejected") return "Não consegui abrir esse arquivo. Envie uma foto (JPG ou PNG) ou um PDF.";
    if (c === "invalid_json" || c === "empty_completion" || c === "refused") return "Não consegui entender essa ordem. Tente uma foto mais nítida, de frente e com boa luz.";
    if (e && e.message === "pdf") return "Não consegui abrir o PDF. Envie uma foto ou um print da ordem.";
    return "A leitura falhou. Tente de novo.";
  }
  async function handleFile(file) {
    if (!file) return;
    st.file = file; st.phase = "reading"; st.err = ""; drawOrdem();
    ordCtl = new AbortController();
    var ctl = ordCtl;
    try {
      var blobs = await toImages(file);
      if (ctl.signal.aborted) return;
      if (prevUrl) { try { URL.revokeObjectURL(prevUrl); } catch (e) {} }
      prevUrl = URL.createObjectURL(blobs[0]); st.preview = prevUrl; drawOrdem();
      var data = await sampleFn.json(ORDEM_PROMPT, { images: blobs, signal: ctl.signal });
      if (ctl.signal.aborted) return;
      ordCtl = null; st.ord = normalize(data); st.phase = "review"; drawOrdem();
    } catch (e) {
      if (ctl.signal.aborted || (e && e.code === "cancelled")) return;
      ordCtl = null; st.phase = "error"; st.err = ordemError(e); drawOrdem();
    }
  }
  function collectOrd() {
    var o = st.ord;
    o.placa = normPlaca($("o-placa").value); o.peso = $("o-peso").value; o.transp = g("o-transp");
    o.motorista = g("o-motorista"); o.produto = $("o-produto").value; o.origem = g("o-origem"); o.destino = g("o-destino"); o.numeroOrdem = g("o-num");
  }
  function drawOrdem() {
    var box = h("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-labelledby": "od-title" });
    put(box, h("h2", { id: "od-title" }, "Ordem de carregamento"));
    if (st.phase === "pick" || st.phase === "error") {
      var drop = h("div", { class: "drop" },
        h("strong", {}, "Envie a foto ou o PDF da ordem"),
        h("span", { class: "muted" }, "O app lê a placa, o peso e a transportadora. Você confere tudo antes de salvar."),
        h("label", { class: "btn primary", for: "o-file" }, "Escolher arquivo"),
        h("input", { id: "o-file", class: "vh", type: "file", accept: (imgLimits.mediaTypes || []).concat(["application/pdf"]).join(","),
          onchange: function (e) { handleFile(e.target.files[0]); } }),
        h("span", { class: "muted" }, "ou arraste o arquivo para cá"));
      drop.addEventListener("dragover", function (e) { e.preventDefault(); drop.classList.add("over"); });
      drop.addEventListener("dragleave", function () { drop.classList.remove("over"); });
      drop.addEventListener("drop", function (e) { e.preventDefault(); drop.classList.remove("over"); handleFile(e.dataTransfer.files[0]); });
      put(box, st.err ? h("div", { class: "warnbox" }, st.err) : null, drop,
        h("p", { class: "muted" }, "A imagem é enviada ao Claude só para a leitura e não fica guardada no app."),
        h("div", { class: "foot" },
          h("button", { class: "btn", type: "button", onclick: function () { closeSheet(); openForm(null); } }, "Lançar manualmente"),
          h("button", { class: "btn", type: "button", onclick: closeSheet }, "Cancelar")));
    } else if (st.phase === "reading") {
      put(box, h("div", { class: "reading" },
        st.preview ? h("img", { class: "thumb", src: st.preview, alt: "Ordem enviada" }) : null,
        h("div", {}, h("strong", {}, "Lendo a ordem…"), h("div", { class: "muted" }, "Isso leva alguns segundos."))),
        h("div", { class: "foot" }, h("button", { class: "btn", type: "button", onclick: closeSheet }, "Cancelar")));
    } else {
      var o = st.ord;
      var pesoHint = o.pesoTipo ? "Lido como: " + o.pesoTipo : "";
      put(box, 
        st.preview ? h("img", { class: "thumb", src: st.preview, alt: "Ordem enviada" }) : null,
        o.avisos.length ? h("div", { class: "warnbox" }, "Confira antes de continuar:", h("ul", {}, o.avisos.map(function (a) { return h("li", {}, a); }))) : null,
        achaPlaca(o.placa).length ? h("div", { class: "warnbox red" }, "A placa " + o.placa + " já foi enviada:",
          h("ul", {}, achaPlaca(o.placa).slice(0, 3).map(function (i) { return h("li", {}, descCarga(i)); }))) : null,
        h("div", { class: "grid2" },
          fld("o-placa", "Placa" + (o.miss.placa ? " (não encontrada)" : ""), inp("o-placa", "text", o.placa, { maxlength: "8", autocomplete: "off", class: "upper" }), o.miss.placa ? "missing" : ""),
          fld("o-peso", "Peso (toneladas)" + (o.miss.peso ? " (não encontrado)" : ""), inp("o-peso", "number", o.peso, { min: "0", step: "0.001", inputmode: "decimal" }), o.miss.peso ? "missing" : ""),
          fld("o-transp", "Transportadora" + (o.miss.transp ? " (não encontrada)" : ""), inp("o-transp", "text", o.transp, { list: "dl-transp", autocomplete: "off" }), (o.miss.transp ? "missing " : "") + "span2")),
        pesoHint ? h("p", { class: "muted" }, pesoHint) : null,
        h("details", { class: "more" }, h("summary", {}, "Outros dados lidos"),
          h("div", { class: "grid2" },
            fld("o-motorista", "Motorista", inp("o-motorista", "text", o.motorista, { autocomplete: "off" })),
            fld("o-produto", "Produto", sel("o-produto", [["", "Não informado"], ["Soja", "Soja"], ["Milho", "Milho"], ["Farelo", "Farelo"], ["Óleo", "Óleo"]], o.produto)),
            fld("o-origem", "Origem", inp("o-origem", "text", o.origem, { autocomplete: "off" })),
            fld("o-destino", "Destino", inp("o-destino", "text", o.destino, { list: "dl-destino", autocomplete: "off" })),
            fld("o-num", "Nº da ordem", inp("o-num", "text", o.numeroOrdem, { autocomplete: "off" }), "span2"))),
        h("datalist", { id: "dl-transp" }, knownTransp().map(function (d) { return h("option", { value: d }); })),
        h("datalist", { id: "dl-destino" }, knownDests().map(function (d) { return h("option", { value: d }); })),
        h("div", { class: "err", id: "od-err" }),
        h("div", { class: "foot" },
          h("button", { class: "btn", type: "button", onclick: closeSheet }, "Cancelar"),
          h("button", { class: "btn primary", type: "button", onclick: ordemToPicker }, "Escolher contrato")));
    }
    openSheet(box);
  }
  function ordemToPicker() {
    collectOrd();
    var o = st.ord, ton = parseFloat(o.peso), err = $("od-err");
    if (!o.placa) { err.textContent = "Informe a placa."; return; }
    if (!(ton > 0)) { err.textContent = "Informe o peso em toneladas."; return; }
    var dups = achaPlaca(o.placa);
    if (dups.length && placaAtiva(dups) && st.dupOk !== o.placa) {
      st.dupOk = o.placa;
      err.className = "err alert"; err.textContent = "Atenção: a placa " + o.placa + " já foi enviada em " + descCarga(dups[0]) + ". Toque em Escolher contrato de novo para continuar.";
      return;
    }
    openPicker({ produto: o.produto, tons: ton, resumo: "Placa " + o.placa + " · " + fmtT(ton) + (o.transp ? " · " + o.transp : ""),
      onBack: drawOrdem,
      onSkip: function () { saveOrdem(null); },
      onPick: function (c) { saveOrdem(c); } });
  }
  async function saveOrdem(c) {
    var o = st.ord;
    var data = {
      data: ymd(), produto: o.produto || (c && c.produto) || "Soja", origem: o.origem, destino: o.destino, motorista: o.motorista,
      placa: o.placa, transportadora: o.transp, toneladas: parseFloat(o.peso), frete: 0, status: "agendada",
      obs: o.numeroOrdem ? "Ordem " + o.numeroOrdem : "", numeroOrdem: o.numeroOrdem || null, contratoId: c ? c.id : null,
      atualizadoEm: new Date().toISOString()
    };
    var guardou = null;
    if (assetsFn && st.file) {
      toast("Guardando a ordem…");
      try {
        var up = await assetsFn.upload(st.file, { type: st.file.type || (/\.pdf$/i.test(st.file.name) ? "application/pdf" : "") });
        data.ordemId = up.id; data.ordemNome = st.file.name || "ordem"; data.ordemTipo = up.contentType;
        guardou = true;
      } catch (e) { guardou = false; }
    }
    var ok = await saveItem(null, data);
    if (ok) {
      closeSheet(); tab = "cargas"; render();
      toast((c ? "Carga lançada no contrato " + c.numero + "." : "Carga lançada sem contrato.") + (guardou === false ? " Mas não consegui guardar o arquivo da ordem." : ""));
    }
  }
  function openOrdem() {
    if (!sampleFn || !imgLimits) return;
    st = { phase: "pick", err: "", preview: null, ord: null };
    drawOrdem();
  }

  /* ---------- início ---------- */
  $("btn-new").addEventListener("click", function () { openForm(null); });
  $("btn-newc").addEventListener("click", function () { openContratoForm(null); });
  $("btn-ordem").addEventListener("click", openOrdem);
  $("overlay").addEventListener("mousedown", function (e) { if (e.target === $("overlay")) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("overlay").hidden) closeSheet(); });
  $("f-q").addEventListener("input", function (e) { filters.q = e.target.value; render(); });
  $("f-status").addEventListener("change", function (e) { filters.status = e.target.value; render(); });
  $("f-produto").addEventListener("change", function (e) { filters.produto = e.target.value; render(); });
  $("f-destino").addEventListener("change", function (e) { filters.destino = e.target.value; render(); });
  $("f-contrato").addEventListener("change", function (e) { filters.contrato = e.target.value; render(); });
  $("f-transp").addEventListener("change", function (e) { filters.transp = e.target.value; render(); });
  $("f-de").addEventListener("change", function (e) { filters.de = e.target.value; render(); });
  $("f-ate").addEventListener("change", function (e) { filters.ate = e.target.value; render(); });
  $("f-clear").addEventListener("click", function () {
    filters = { q: "", status: "todas", produto: "", destino: "", contrato: "", transp: "", de: "", ate: "" };
    $("f-q").value = ""; $("f-de").value = ""; $("f-ate").value = "";
    $("f-status").value = "todas";
    ["f-produto", "f-destino", "f-contrato", "f-transp"].forEach(function (id) { $(id).value = ""; });
    render();
  });

  render();

  (async function () {
    var db = null, user = null;
    try {
      db = window.claude && await window.claude.use("db");
      user = window.claude && await window.claude.use("user");
      sampleFn = window.claude && await window.claude.use("sample");
      downloadFn = window.claude && await window.claude.use("downloads");
      assetsFn = window.claude && await window.claude.use("assets");
    } catch (e) { /* segue sem o recurso ausente */ }
    if (sampleFn) {
      try { var lim = await sampleFn.limits(); imgLimits = lim && lim.images ? lim.images : null; } catch (e) { imgLimits = null; }
    }
    if (!db) { noDb = true; render(); return; }
    try { var can = user ? await user.can("data.write") : null; canWrite = can !== false; } catch (e) { canWrite = true; }
    col = db.collection("cargas"); colC = db.collection("contratos"); colL = db.collection("liberacoes");
    col.orderBy("data", "desc").onSnapshot(function (snap) {
      items = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      loaded = true; render();
    }, function () { loaded = true; noDb = true; render(); });
    colC.onSnapshot(function (snap) {
      contratos = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      loadedC = true; render();
    }, function () { loadedC = true; render(); });
    colL.onSnapshot(function (snap) {
      liberacoes = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      render();
      if (lbSheetFor) { var cc = contratoById(lbSheetFor); if (cc) liberarEmbarque(cc); }
    }, function () {});
  })();
})();
</script>
